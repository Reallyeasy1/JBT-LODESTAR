name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checks:
    name: Lint · Typecheck · Build
    runs-on: ubuntu-latest

    env:
      # Dummy URL — build-time checks don't need a live DB.
      # If next build fails because App Router code runs DB queries at build,
      # uncomment the `services: mysql:` block below and add a `prisma db push` step.
      DATABASE_URL: "mysql://root:password@localhost:3306/lodestar"
      AI_PROVIDER: "mock"
      NEXT_PUBLIC_DEMO_EVENT_ID: "cle00000000000000000001"

    # Uncomment if `next build` requires a real DB:
    # services:
    #   mysql:
    #     image: mysql:8
    #     env:
    #       MYSQL_ROOT_PASSWORD: password
    #       MYSQL_DATABASE: lodestar
    #     ports:
    #       - 3306:3306
    #     options: >-
    #       --health-cmd "mysqladmin ping -ppassword"
    #       --health-interval 5s
    #       --health-timeout 5s
    #       --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: Prisma validate
        run: npx prisma validate

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
